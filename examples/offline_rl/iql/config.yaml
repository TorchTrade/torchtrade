# env and task
env:
  name: SequentialTradingEnv
  symbol: "BTC/USD"
  time_frames: ["5Min", "15Min"]
  window_sizes: [10, 10]
  execute_on: "5Min"
  initial_cash: 1000
  transaction_fee: 0.015
  slippage: 0.01
  bankrupt_threshold: 0.1
  exp_name: ${logger.exp_name}
  seed: 0
  data_path: Torch-Trade/btcusdt_spot_1m_03_2023_to_12_2025

# logger
logger:
  backend: wandb
  project_name: TorchTrade-Offline
  exp_name: iql
  group_name: null
  eval_iter: 200
  eval_steps: 10000  # long enough to run the 14-day test split to done
  mode: online

# replay buffer
replay_buffer:
  batch_size: 256
  data_path: synthetic  # Use "synthetic" to generate synthetic data for testing
  buffer_size: 10000

# optimization
optim:
  device: null
  lr: 3e-4
  weight_decay: 0.0
  gradient_steps: 40000

# network
model:
  hidden_sizes: [256, 256]
  activation: relu

# loss
loss: 
  loss_function: l2
  gamma: 0.99
  hard_update_interval: 10


# IQL specific hyperparameter
  temperature: 3.0
  expectile: 0.7

compile:
  compile: False
  compile_mode:
  cudagraphs: False

# Hydra configuration - saves outputs in example directory
hydra:
  run:
    dir: ${script_dir:}/outputs/${env.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/outputs/${env.name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}