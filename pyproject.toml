[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchtrade"
dynamic = ["version"]
description = "Reinforcement learning environments for trading applications"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sebastian Dittert", email = "torchtradecontact@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Imported directly by the package. They arrive transitively via torchrl and
    # alpaca-py today, which is not a contract: floors verified by running the suite
    # against numpy 1.26.4 / pandas 2.1.4. torch's floor is torchrl 0.13's own.
    "torch>=2.1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "alpaca-py",
    "python-binance",
    "ccxt>=4.0.0", # Replaced python-bitget with ccxt for V2 API support
    "pybit>=5.0.0",
    "python-okx>=0.3.0",
    # RL stack pinned in lockstep (torchrl + tensordict MUST move together — a
    # skew is what silently broke CI before this pin). torchrl 0.13 removed the
    # `SyncDataCollector` alias (use `Collector`); torch floor (2.1.0) is met by 2.9.0.
    # 0.13.2 floor: the LLMTrainer's vLLMWrapper needs it to import against vLLM >= 0.13.
    "torchrl>=0.13.2,<0.14",
    "tensordict>=0.13,<0.14",
    "wandb",
    "matplotlib",
    "ta",
    "datasets>=3.0",  # <3 calls pyarrow.PyExtensionType, removed in pyarrow 25
]

[project.optional-dependencies]
examples = [
    # Not imported anywhere under torchtrade/; only the scripts in examples/ use them.
    "python-dotenv",
    "tqdm",
    "hydra-core",
    "scikit-learn>=1.6.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs-material",
]
llm = [
    "openai>=1.0.0",
    "vllm>=0.6.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "bitsandbytes>=0.41.0",
    "feedparser>=6.0.0",
    "peft>=0.10.0",
]
chronos = [
    "chronos-forecasting",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# An empty parametrize list otherwise collects zero tests and reports a silent pass --
# the failure mode that let a dead test file sit in this repo undetected.
empty_parameter_set_mark = "fail_at_collect"

[project.urls]
"Homepage" = "https://github.com/TorchTrade/torchtrade"
"Bug Reports" = "https://github.com/TorchTrade/torchtrade/issues"
"Source" = "https://github.com/TorchTrade/torchtrade"

[tool.hatch.version]
path = "torchtrade/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["torchtrade"]
